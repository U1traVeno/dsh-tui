# dsh-tui bundle patch: a terminal client over dsh-base.
#
# The base bundle provides the full spine (agent, session, tools, goal, plan,
# subagent, workflow, jobs, approval, user-questions, commands, skills,
# settings, …) with the per-agent tool rows kept host-plane and process-wide —
# exactly the single-session composition `dsh-web-app` documents for a TUI.
# This bundle adds the transport-agnostic host rows the web surface also adds
# (minus the webserver and every browser-only row), restates the persona, and
# mounts the terminal front door.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- id: hmr
  disabled: true

- id: tools
  config:
    # Keep the same process-wide Code Mode opt-in as the Web and headless surfaces.
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    # ── transport-agnostic host rows (web parity, minus the browser) ──────────

    # Code Mode: the native tool schemas may delegate to an in-process worker.
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    # Non-session persistence (settings domains, message feedback sidecar,
    # workspace registry). Mirrors the dsh-web-app rows.
    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json

    # Persistent workspace registry: group sessions by workspace like the Web sidebar.
    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    # Durable projection cache + whole-log turn/step counts for the stats strip.
    - id: session-projection-cache
      name: '@deepseek-ai/dsh-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'

    # Per-message Like/Dislike + optional note.
    - id: message-feedback
      name: '@deepseek-ai/dsh-message-feedback'
      config:
        maxNoteBytes: 8192

    # Session export (`/export`).
    - id: session-log-download
      name: '@deepseek-ai/dsh-session-log-export'

    # ── terminal front door ──────────────────────────────────────────────────

    # Parses `dsh --profile tui [flags]` and publishes the tuiStartup service.
    - id: tui-startup
      name: '@v3n0/dsh-tui/startup'

    # The terminal client: creates (or resumes) one agent, drives a single-pane
    # chat UI, and renders every surface from the host services + the session log.
    - id: tui-frontdoor
      name: '@v3n0/dsh-tui'
      inject: [tuiStartup]
